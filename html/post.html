<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../css/post.css">
</head>

<body>
<h2>Post your blog</h2>
<div class="blog-form">

 <form action="/action_page.php">
   <label for="title">Title</label>
   <input type="text" id="title" name="title" placeholder="Title">

   <label for="date">Date/Author:</label>
   <input type="text" id="dateauthor" name="date/author" placeholder="Enter the Date and Author">

   <label for="category">Category:</label>
   <select id="category" name="category">
    <option value="art">Art</option>
    <option value="food">Food</option>
    <option value="sports">Sport</option>
    <option value="travel">Travel</option>
    <option value="videogame">Videogame</option>
    <option value="movie">Movie</option>

    </select>
    <label for="Description">Description:</label>
    <textarea id="Description" name="Description" placeholder="Write something.."></textarea>
    <div class="form-group">
                <label for="myFile">Upload Image:</label>
                <input type="file" id="myFile" name="filename" accept="image/*">
            </div>

    <button type="submit" class="registerbtn"><a href="index.html">Submit</a></button>
 </form>

</div>

</body>
</html>
